<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 1 18 22" width="32" height="32" role="img" aria-label="Aegis">
  <title>Aegis</title>

  <!-- Solid silhouette, not the outlined Lucide shield used in the sidebar.
       A 1.8px stroke is annihilated by antialiasing once a browser renders
       this at 16px in a tab, so the shape has to carry it. Tested: a stroked
       checkmark variant disappeared entirely at that size. -->
  <path fill="#4C8DFF"
        d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>

  <!-- One chain node, knocked out of the shield. Not decoration: the console
       draws every log entry as exactly this shape, a ring with a filled core,
       so the tab icon is a single node of the provenance chain. A two-node
       link was tried first and collapsed into a smudge at 16px. -->
  <circle cx="12" cy="11.6" r="3.2" fill="#08090C"/>
  <circle cx="12" cy="11.6" r="1.3" fill="#4C8DFF"/>
</svg>
